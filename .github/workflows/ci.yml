name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Download Go modules
        run: go mod download

      - name: Verify Go modules
        run: go mod verify

      - name: Install incident pipeline dependencies
        run: >-
          python -m pip install
          -r examples/incident_agent_pipeline/requirements.txt

      - name: Verify Python dependencies
        run: python -m pip check

      - name: Check Go formatting
        shell: bash
        run: test -z "$(find . -name '*.go' -print0 | xargs -0 gofmt -l)"

      - name: Run Go tests with race detection
        run: go test -race ./...

      - name: Run Go static analysis
        run: go vet ./...

      - name: Enforce Go coverage floor
        shell: bash
        run: |
          go test ./... -coverprofile "${RUNNER_TEMP}/coverage.out"
          coverage="$(
            go tool cover -func "${RUNNER_TEMP}/coverage.out" |
              awk '/^total:/ {gsub("%", "", $3); print $3}'
          )"
          awk -v coverage="${coverage}" \
            'BEGIN { if (coverage + 0 < 75) exit 1 }'

      - name: Compile Python sources
        run: >-
          python -m compileall -q
          sdk/python
          examples/incident_agent_pipeline

      - name: Run Python SDK tests
        working-directory: sdk/python
        run: python -m unittest -v

      - name: Run incident agent pipeline tests
        run: >-
          python -m unittest discover
          -s examples/incident_agent_pipeline/tests
          -v

      - name: Generate Python integration trace
        run: python examples/python_recorded_pipeline.py "${{ runner.temp }}/python-trace.json"

      - name: Validate Python integration trace
        run: >-
          go run ./cmd/agenttrace validate
          --input "${{ runner.temp }}/python-trace.json"
          --checkers ./examples/python-checkers.json

      - name: Run contextual document attribution
        run: go run ./cmd/agenttrace demo document --failure extraction --json

      - name: Regenerate incident agent replay traces
        shell: bash
        run: |
          python -m examples.incident_agent_pipeline \
            --mode replay \
            --failure none \
            --trace-output "${RUNNER_TEMP}/incident-healthy.json" >/dev/null
          python -m examples.incident_agent_pipeline \
            --mode replay \
            --failure metrics \
            --trace-output "${RUNNER_TEMP}/incident-metrics.json" >/dev/null
          python -m examples.incident_agent_pipeline \
            --mode replay \
            --failure deployment \
            --trace-output "${RUNNER_TEMP}/incident-deployment.json" >/dev/null
          cmp "${RUNNER_TEMP}/incident-healthy.json" \
            examples/incident_agent_pipeline/traces/healthy.json
          cmp "${RUNNER_TEMP}/incident-metrics.json" \
            examples/incident_agent_pipeline/traces/metrics-failure.json
          cmp "${RUNNER_TEMP}/incident-deployment.json" \
            examples/incident_agent_pipeline/traces/deployment-failure.json

      - name: Validate generated incident trace
        run: >-
          go run ./cmd/agenttrace validate
          --input "${{ runner.temp }}/incident-healthy.json"
          --checkers ./examples/incident_agent_pipeline/checkers-v2.json
          --context ./examples/incident_agent_pipeline/context.json

      - name: Verify attribution failure exit gate
        shell: bash
        run: |
          go build -o "${RUNNER_TEMP}/agenttrace" ./cmd/agenttrace
          set +e
          "${RUNNER_TEMP}/agenttrace" run \
            --input "${RUNNER_TEMP}/incident-metrics.json" \
            --checkers ./examples/incident_agent_pipeline/checkers-v2.json \
            --context ./examples/incident_agent_pipeline/context.json \
            --json \
            --fail-on-attribution \
            >"${RUNNER_TEMP}/incident-result.json" \
            2>"${RUNNER_TEMP}/incident-error.txt"
          status=$?
          set -e
          test "${status}" -eq 1
          python -c \
            'import json, os; result=json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "incident-result.json"))); assert result["status"] == "failed"; assert result["root_cause"]["step_id"] == "metrics_analyzer"'
