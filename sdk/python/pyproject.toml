[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agenttrace-recorder"
version = "0.1.0"
description = "Dependency free Python trace recorder for AgentTrace"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "AgentTrace contributors"}
]

[tool.setuptools]
py-modules = ["agenttrace"]
